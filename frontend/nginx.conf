# Single-origin production proxy.
# The React build is served on :80 and /api + /ws are proxied to the
# backend service so the browser never needs CORS.
upstream backend {
  server backend:8000;
}

server {
  listen 80;
  server_name _;
  root /usr/share/nginx/html;
  index index.html;

  # Gzip the dashboard bundle.
  gzip on;
  gzip_types text/css application/javascript application/json image/svg+xml;
  gzip_min_length 1024;

  # MJPEG live feed is a long-lived stream — disable buffering.
  # NOTE: must come BEFORE /api/ (nginx picks the longest prefix match,
  # so /api/streams/... correctly lands here, not in the block below).
  location /api/streams/ {
    proxy_pass http://backend/streams/;
    proxy_set_header Host $host;
    proxy_buffering off;
    proxy_cache off;
    proxy_read_timeout 3600s;
  }

  # REST: /api/health -> backend:/health, /api/streams -> /streams, ...
  location /api/ {
    proxy_pass http://backend/;
    proxy_set_header Host $host;
    proxy_set_header X-Real-IP $remote_addr;
    proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
    proxy_set_header X-Forwarded-Proto $scheme;
    proxy_read_timeout 60s;
  }

  # WebSockets: /ws/alerts and /ws/streams/{id}
  location /ws/ {
    proxy_pass http://backend/ws/;
    proxy_http_version 1.1;
    proxy_set_header Upgrade $http_upgrade;
    proxy_set_header Connection "upgrade";
    proxy_set_header Host $host;
    proxy_read_timeout 3600s;
    proxy_send_timeout 3600s;
  }

  # SPA fallback.
  location / {
    try_files $uri $uri/ /index.html;
  }
}
