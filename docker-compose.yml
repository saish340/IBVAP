# ------------------------------------------------------------------
# IBVAP — Real-Time Video Analytics Platform
#
# Local / VPS:
#   docker compose up --build
#   backend  : http://localhost:8000   (API docs at /docs)
#   frontend : http://localhost:8080   (nginx prod build, /api+/ws proxied)
#   storage  : ibvap_data volume (./data/ibvap.db + watchlist.db)
#
# Copy .env.example to .env to override credentials / settings.
# ------------------------------------------------------------------

services:
  backend:
    build:
      context: .
      dockerfile: Dockerfile
    restart: unless-stopped
    environment:
      DATABASE_URL: sqlite:///./data/ibvap.db
      WATCHLIST_DB: data/watchlist.db
      # In production set CORS_ORIGINS to your public frontend URL(s).
      # Same-origin via nginx needs no CORS, but split deploys do.
      CORS_ORIGINS: ${CORS_ORIGINS:-http://localhost:8080,http://localhost:5173}
      YOLO_MODEL: ${YOLO_MODEL:-yolov8n.pt}
      PROCESS_EVERY_N_FRAMES: ${PROCESS_EVERY_N_FRAMES:-5}
      RTSP_RECONNECT_DELAY: ${RTSP_RECONNECT_DELAY:-2}
      PERSIST_INTERVAL_SECONDS: ${PERSIST_INTERVAL_SECONDS:-10}
    ports:
      - "${BACKEND_PORT:-8000}:8000"
    volumes:
      - ibvap_data:/app/data
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://localhost:8000/health')"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 60s
    # Uncomment for live-reload during development:
    # volumes:
    #   - ./backend:/app/backend
    #   - ./ingestion:/app/ingestion
    #   - ./inference:/app/inference
    # command: uvicorn backend.main:app --host 0.0.0.0 --port 8000 --reload

  frontend:
    build:
      context: ./frontend
      dockerfile: Dockerfile
      args:
        # Empty = same-origin mode (nginx proxies /api + /ws to backend).
        # For split deploys build with VITE_API_URL=https://<backend-host>.
        VITE_API_URL: ${VITE_API_URL:-}
        VITE_WS_URL: ${VITE_WS_URL:-}
    restart: unless-stopped
    ports:
      - "${FRONTEND_PORT:-8080}:80"
    depends_on:
      backend:
        condition: service_started

volumes:
  ibvap_data:

