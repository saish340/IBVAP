# ------------------------------------------------------------------
# IBVAP — Real-Time Video Analytics Platform
#
#   docker compose up --build
#
#   backend  : http://localhost:8000   (API docs at /docs)
#   frontend : http://localhost:5173   (Vite dev-server placeholder)
#   storage  : ./ibvap.db and ./watchlist.db
#
# Copy .env.example to .env to override credentials / settings.
# ------------------------------------------------------------------

services:
  backend:
    build:
      context: .
      dockerfile: Dockerfile
    restart: unless-stopped
    environment:
      DATABASE_URL: sqlite:///./data/ibvap.db
      WATCHLIST_DB: data/watchlist.db
      CORS_ORIGINS: "http://localhost:5173"
      YOLO_MODEL: ${YOLO_MODEL:-yolov8n.pt}
      PROCESS_EVERY_N_FRAMES: ${PROCESS_EVERY_N_FRAMES:-5}
      RTSP_RECONNECT_DELAY: ${RTSP_RECONNECT_DELAY:-2}
      PERSIST_INTERVAL_SECONDS: ${PERSIST_INTERVAL_SECONDS:-10}
    ports:
      - "8000:8000"
    volumes:
      - ibvap_data:/app/data
    # Uncomment for live-reload during development:
    # volumes:
    #   - ./backend:/app/backend
    #   - ./ingestion:/app/ingestion
    #   - ./inference:/app/inference
    # command: uvicorn backend.main:app --host 0.0.0.0 --port 8000 --reload

  frontend:
    build:
      context: ./frontend
      dockerfile: Dockerfile
    restart: unless-stopped
    environment:
      # Vite dev-server proxy target (the compose service name of the API)
      VITE_API_TARGET: http://backend:8000
    ports:
      - "5173:5173"
    depends_on:
      - backend

volumes:
  ibvap_data:
